<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resonance Scope</title>
  </head>
  <body>
    <main>
      <button id="mic-toggle" type="button">Start capture</button>
      <p>Peak: <span id="peak-db">&mdash;</span> dB</p>
      <p>F0: <span id="f0-hz">&mdash;</span> Hz</p>
      <p
        id="readout-announcement"
        role="status"
        style="
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
        "
      ></p>
      <p id="mic-status" role="status"></p>
      <canvas
        id="spectrogram"
        width="600"
        height="300"
        aria-label="Live spectrogram: frequency content of the microphone input over time, brightness shows intensity"
      ></canvas>
      <p>
        <button id="delete-all" type="button">Delete all sessions</button>
        <button id="export-json" type="button">Export sessions as JSON</button>
      </p>
    </main>
    <section id="calibration">
      <h2>Calibration</h2>
      <button id="wizard-start" type="button">Start calibration</button>
      <div id="wizard-panel" hidden>
        <p id="wizard-progress"></p>
        <p id="wizard-prompt"></p>
        <p id="wizard-validity" role="status"></p>
        <p>
          <button id="wizard-redo" type="button" hidden>Redo this step</button>
          <button id="wizard-next" type="button" hidden>Next</button>
          <button id="wizard-cancel" type="button">Cancel</button>
        </p>
      </div>
      <p id="wizard-status" role="status"></p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
